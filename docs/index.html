<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Analitik Jual Beli Akun Game · PT XYZ</title>
<meta name="description" content="Analisis penjualan akun Free Fire, Mobile Legends, dan Roblox: revenue, margin, stok, risiko, dan opsi keputusan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --plane: #f3f3ef;
  --surface: #fcfcfb;
  --surface-2: #f6f6f3;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #74726c;
  --grid: #e7e6e0;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --primary: #1c5cab;
  --primary-ink: #ffffff;
  --primary-wash: rgba(42, 120, 214, 0.08);
  --band: rgba(42, 120, 214, 0.07);
  --accent: #b87700;
  --up: #006300;
  --down: #b3261e;
  --up-wash: rgba(12, 163, 12, 0.10);
  --down-wash: rgba(208, 59, 59, 0.10);
  --s-ff: #2a78d6;
  --s-ml: #eb6834;
  --s-rb: #1baf7a;
  --s-yellow: #eda100;
  --s-violet: #4a3aa7;
  --s-magenta: #e87ba4;
  --s-green: #008300;
  --s-other: #b5b3ab;
  --s-line2: #52514e;
  --o1: #86b6ef;
  --o2: #5598e7;
  --o3: #2a78d6;
  --o4: #1c5cab;
  --o5: #0d366b;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04);
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #45453f;
    --border: rgba(255, 255, 255, 0.10);
    --primary: #5598e7;
    --primary-ink: #0b0b0b;
    --primary-wash: rgba(57, 135, 229, 0.14);
    --band: rgba(57, 135, 229, 0.12);
    --accent: #e0a32a;
    --up: #2fbf2f;
    --down: #ff7b72;
    --up-wash: rgba(12, 163, 12, 0.16);
    --down-wash: rgba(230, 103, 103, 0.16);
    --s-ff: #3987e5;
    --s-ml: #d95926;
    --s-rb: #199e70;
    --s-yellow: #c98500;
    --s-violet: #9085e9;
    --s-magenta: #d55181;
    --s-green: #008300;
    --s-other: #5c5b55;
    --s-line2: #c3c2b7;
    --o1: #184f95;
    --o2: #256abf;
    --o3: #3987e5;
    --o4: #6da7ec;
    --o5: #9ec5f4;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #45453f;
  --border: rgba(255, 255, 255, 0.10);
  --primary: #5598e7;
  --primary-ink: #0b0b0b;
  --primary-wash: rgba(57, 135, 229, 0.14);
  --band: rgba(57, 135, 229, 0.12);
  --accent: #e0a32a;
  --up: #2fbf2f;
  --down: #ff7b72;
  --up-wash: rgba(12, 163, 12, 0.16);
  --down-wash: rgba(230, 103, 103, 0.16);
  --s-ff: #3987e5;
  --s-ml: #d95926;
  --s-rb: #199e70;
  --s-yellow: #c98500;
  --s-violet: #9085e9;
  --s-magenta: #d55181;
  --s-green: #008300;
  --s-other: #5c5b55;
  --s-line2: #c3c2b7;
  --o1: #184f95;
  --o2: #256abf;
  --o3: #3987e5;
  --o4: #6da7ec;
  --o5: #9ec5f4;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); }
button, select, input { font: inherit; color: inherit; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 14px 24px; display: flex; flex-direction: column; gap: 18px;
}
.brand { padding: 0 8px; }
.brand .co { font-weight: 650; font-size: 15px; line-height: 1.3; }
.brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; gap: 10px; align-items: baseline; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 8px;
  padding: 8px 10px; cursor: pointer; color: var(--ink-2); font-size: 13.5px;
}
.nav button .no { color: var(--muted); font-variant-numeric: tabular-nums; width: 16px; flex: none; font-size: 12px; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--primary-wash); color: var(--primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
.nav button[aria-current="page"] .no { color: var(--primary); }
.side-foot { margin-top: auto; padding: 0 8px; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
.theme-btn { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; }

.main { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--plane) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  padding: 10px 28px;
}
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.fgroup { display: flex; align-items: center; gap: 8px; }
.fgroup > label, .flabel { color: var(--muted); font-size: 12px; }
.select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; min-height: 34px; cursor: pointer;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; min-height: 32px;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.chip[aria-pressed="true"] { border-color: color-mix(in srgb, var(--ink) 25%, transparent); }
.fnote { color: var(--muted); font-size: 12px; margin-left: auto; }
.menu-btn { display: none; }

.page { padding: 24px 28px 64px; max-width: 1360px; }
.eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; font-weight: 600; }
h1.headline { font-size: 22px; line-height: 1.35; margin: 6px 0 8px; font-weight: 650; max-width: 980px; text-wrap: pretty; }
.lede { color: var(--ink-2); max-width: 900px; margin: 0 0 6px; }
.ctx { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
h2.sec { font-size: 15px; margin: 30px 0 12px; font-weight: 650; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g1 { grid-template-columns: minmax(0, 1fr); }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.span2 { grid-column: span 2; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); min-width: 0;
}
.card h3 { font-size: 14px; margin: 0; font-weight: 620; line-height: 1.4; }
.card .csub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.card-head { display: flex; justify-content: space-between; gap: 8px 12px; align-items: flex-start; flex-wrap: wrap; }
.tbtn {
  flex: none; background: none; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; padding: 3px 8px; color: var(--ink-2); cursor: pointer;
}
.tbtn:hover { background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--primary-wash); color: var(--primary); font-weight: 600; }

/* ---------- KPI tile ---------- */
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { color: var(--ink-2); font-size: 12.5px; }
.kpi .val { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.kpi .meta { color: var(--muted); font-size: 12px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 1px 6px; width: fit-content; }
.delta.up { color: var(--up); background: var(--up-wash); }
.delta.down { color: var(--down); background: var(--down-wash); }
.delta.flat { color: var(--ink-2); background: var(--surface-2); }
.kpi svg.spark { margin-top: 4px; }

/* ---------- narrative ---------- */
.story { display: grid; gap: 10px; }
.story p { margin: 0; }
.ins { border-left: 3px solid var(--primary); padding: 2px 0 2px 12px; }
.ins.risk { border-left-color: var(--down); }
.ins.opp { border-left-color: var(--up); }
.ins.hyp { border-left-color: var(--accent); }
.ins .t { font-weight: 620; }
.ins .e, .ins .i { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.ins .i b, .ins .e b { color: var(--ink); font-weight: 600; }
.lbl-mini { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; margin-right: 4px; }
.conf { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px 1px 7px; white-space: nowrap; vertical-align: middle; font-weight: 500; }
.conf i { display: inline-flex; gap: 2px; }
.conf i span { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); }
.conf i span.on { background: var(--ink-2); }
.tag { display: inline-block; font-size: 11px; font-weight: 650; border-radius: 4px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.tag.hyp { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
.tag.sev-h { color: var(--down); border: 1px solid color-mix(in srgb, var(--down) 45%, transparent); }
.tag.sev-m { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.tag.sev-l { color: var(--ink-2); border: 1px solid var(--border); }

.exec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.exec-grid .card h3 { margin-bottom: 8px; }
.exec-grid ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.exec-grid li { color: var(--ink-2); }
.exec-grid li b { color: var(--ink); }
.implication { background: var(--primary-wash); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
.implication ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 8px; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.callout { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); font-size: 13px; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .lab { fill: var(--ink-2); font-size: 11.5px; }
.chart .lab-strong { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .bandr { fill: var(--band); }
.chart .xhair { stroke: var(--axis); stroke-width: 1; }
.chart .mark { transition: opacity .12s; }
.chart .mark:hover, .chart .mark.hot { opacity: .78; }
.chart .dim { opacity: .35; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 2px 0 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .ln { width: 14px; height: 2px; border-radius: 1px; }
.tooltip {
  position: fixed; z-index: 100; pointer-events: none; opacity: 0;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 120px; max-width: 280px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .12); transition: opacity .08s;
}
.tooltip .tt-h { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
.tooltip .tt-r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tooltip .tt-r .k { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tooltip .tt-r .k i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.tooltip .tt-r .v { font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
table.t th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--ink); }
table.t th .ar { color: var(--muted); font-size: 10px; margin-left: 3px; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.sub td:first-child { padding-left: 24px; color: var(--ink-2); }
table.t tr.grp td { background: var(--surface-2); font-weight: 600; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
table.t td .bar { height: 6px; border-radius: 3px; background: var(--o3); min-width: 1px; }
table.t td.wrap { min-width: 220px; }
.up-t { color: var(--up); }
.down-t { color: var(--down); }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; }

.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.flow .st { flex: 1 1 150px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); }
.flow .st b { display: block; color: var(--ink); margin-bottom: 2px; }
.flow .arrow { align-self: center; color: var(--muted); }

details.qa { border-bottom: 1px solid var(--grid); padding: 10px 0; }
details.qa summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary .qn { color: var(--muted); font-variant-numeric: tabular-nums; width: 24px; flex: none; }
details.qa .ans { color: var(--ink-2); margin: 6px 0 2px 34px; }

.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
.sim .ctrl { display: grid; gap: 14px; }
.sim .ctrl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.sim .ctrl label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sim input[type=range] { width: 100%; accent-color: var(--primary); }

.foot { color: var(--muted); font-size: 12px; margin-top: 40px; border-top: 1px solid var(--border); padding-top: 12px; }

@media (max-width: 1100px) {
  .exec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 50;
    transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2);
  }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .topbar { padding: 10px 16px; position: static; }
  .page { padding: 18px 16px 48px; }
  .g2, .g3, .exec-grid, .sim { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  h1.headline { font-size: 19px; }
  .fnote { margin-left: 0; width: 100%; }
  .kpi .val { font-size: 22px; }
}
@media print {
  .sidebar, .topbar { display: none; }
  .app { display: block; }
}
[hidden] { display: none !important; }

.page > .grid + .grid, .page > .card + .grid, .page > .grid + .card, .page > .card + .card { margin-top: 16px; }
.tag, .conf { white-space: nowrap; }
.dec-card { margin-top: 16px; }
.dec-card .dec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px 20px; align-items: start; margin-bottom: 10px; }
.dec-card .dec-head .lbl-mini { display: block; margin-bottom: 2px; }
.dec-card .dec-head p { margin: 0; color: var(--ink-2); font-size: 13px; }
@media (max-width: 860px) { .dec-card .dec-head { grid-template-columns: 1fr; } }

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navigasi halaman">
    <div class="brand">
      <div class="co" id="brand-co"></div>
      <div class="sub">Dashboard analitik jual beli akun game</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button type="button" class="theme-btn" id="theme-btn">Ganti tema terang/gelap</button>
      <span>Free Fire · Mobile Legends · Roblox</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="filters" role="group" aria-label="Filter global">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Buka menu">☰ Menu</button>
        <div class="fgroup"><label for="f-preset">Periode</label><select id="f-preset" class="select"></select></div>
        <div class="fgroup" id="f-custom" hidden>
          <select id="f-from" class="select" aria-label="Dari bulan"></select><span class="flabel">s.d.</span><select id="f-to" class="select" aria-label="Sampai bulan"></select>
        </div>
        <div class="fgroup"><span class="flabel">Game</span><div class="chips" id="f-games"></div></div>
        <span class="fnote" id="f-note"></span>
      </div>
    </header>
    <main id="page" class="page"></main>

    kpi("Transaksi", num(A.trx), deltaEl(A.trx, B && B.trx), pr ? `vs ${num(B.trx)}` : ""),

      <li>Sejak September volume tertahan di <b>${Math.min(...exm)}–${Math.max(...exm)} transaksi per bulan</b>. Pertumbuhan Q4 datang dari harga per transaksi.</li>
      <li>Free Fire tetap tulang punggung: ${pct(S.conc.rev_share.FF, 0)} revenue dan ${pct(S.conc.gp_share.FF, 0)} laba kotor sepanjang data.</li></ul>` }),
    h("div", { class: "card", html: `<h3>Pergerakan utama (Q4 vs Q3)</h3><ul>
      <li>Revenue ${rpS(Q3.rev)} → <b>${rpS(Q4.rev)}</b> (${spct(chg(Q4.rev, Q3.rev))}).</li>
      <li>Transaksi ${num(Q3.trx)} → <b>${num(Q4.trx)}</b> (${spct(chg(Q4.trx, Q3.trx))}); AOV ${spct(chg(Q4.aov, Q3.aov))}.</li>
      <li>GPM ${pct(Q3.gpm)} → <b>${pct(Q4.gpm)}</b> (${spp(Q4.gpm - Q3.gpm)}).</li>
      <li>Per game: ML ${spct(chg(Q4.ML.rev, Q3.ML.rev), 0)}, FF ${spct(chg(Q4.FF.rev, Q3.FF.rev))}, Roblox ${spct(chg(Q4.RB.rev, Q3.RB.rev))}.</li>
      <li>Desember 2025 bulan tertinggi: <b>${rpS(S.dec.rev)}</b> (${spct(chg(S.dec.rev, S.nov.rev))} dari November).</li></ul>` }),
    h("div", { class: "card", html: `<h3>Penggerak utama ${conf("High")}</h3><ul>
      <li>Efek kenaikan AOV <b>${srp(S.dec_q4q3.ALL.aov)}</b>, efek volume hanya <b>${srp(S.dec_q4q3.ALL.vol)}</b>.</li>
      <li>Kanal ${MJ} (mulai ${dt(K.start)}) sudah <b>${pct(K.q4.mitra_share)}</b> revenue Q4.</li>
      <li>Roblox turun karena stok borongan Juli habis. Di luar batch itu revenue Roblox ${moveWord(S.rb.ex_rev_q3, S.rb.ex_rev_q4)} (${rpS(S.rb.ex_rev_q3)} → ${rpS(S.rb.ex_rev_q4)}).</li>
      <li>ML pindah ke akun massal: AOV ${rpS(S.ml.aov_h1)} → ${rpS(S.ml.aov_h2)}, GPM ${pct(S.ml.gpm_h1, 0)} → ${pct(S.ml.gpm_h2, 0)}.</li></ul>` }),
    h("div", { class: "card", html: `<h3>Risiko</h3><ul>
      <li><b>Margin kanal mitra ${pct(K.q4.mitra_gpm)}</b> vs ${pct(K.q4.Langsung.gpm)} di kanal langsung; selisihnya ±${rpS(K.gap_q4)} laba kotor di Q4. ${conf("High")}</li>
      <li>Ketergantungan: FF ${pct(S.conc.rev_share.FF, 0)} revenue; dua admin menangani ${pct(S.admin.top2_trx_q4, 0)} transaksi Q4. ${conf("Medium")}</li>
      <li>Stok Roblox lambat: ${num(S.ready.RB.n)} akun Ready, modal ${rpS(S.ready.RB.modal)}; ${S.rb.batch_ready} akun batch Juli belum laku ±${S.ready.batch_age} hari. ${conf("High")}</li>
      <li>Pencatatan melemah: kontak penjual tidak dicatat sejak Okt 2025; ${S.loss.n} akun hilang tanpa pendapatan (${rpS(S.loss.modal)}). ${conf("High")}</li></ul>` }),
    h("div", { class: "card", html: `<h3>Peluang</h3><ul>
      <li>FF dan ML hampir selalu habis: sell-through kohort FF ${pct(S.sellthrough.FF.min, 0)}–100%, median laku ${S.dts.FF.med} hari. Ruang menambah pasokan. ${HYP} ${conf("Medium")}</li>
      <li>Tren Roblox <b>Fish It</b>: median laku ${S.rb.seg["Fish It"].dts} hari, AOV ${rpS(S.rb.seg["Fish It"].aov)}. ${conf("Medium")}</li>
      <li>Menutup separuh selisih margin mitra ≈ <b>+${rpS(K.gap_q4 / 2)}</b> laba kotor per kuartal. ${HYP} ${conf("Medium")}</li>
      <li>Stok Ready bernilai daftar ${rpS(S.ready.list)} (modal ${rpS(S.ready.modal)}) bisa dicairkan. ${conf("High")}</li></ul>` }),
    h("div", { class: "card implication", html: `<h3>Implikasi untuk manajemen</h3><ol>
      <li>Tetapkan aturan main kanal mitra (batas margin atau jenis stok yang boleh) sebelum porsinya membesar.</li>
      <li>Jadikan pasokan FF/ML tuas pertumbuhan utama: target stok masuk ≥ penjualan bulan sebelumnya, dan catat permintaan yang tidak terlayani.</li>
      <li>Bersihkan stok Roblox > 90 hari dan ganti pola beli Roblox ke batch kecil yang mengikuti tren.</li>
      <li>Kembalikan disiplin pencatatan: kontak penjual, tanggal masuk, satuan rupiah, alasan kerugian.</li></ol>` })
  );
  root.append(blocks);

  root.append(sec("Revenue per bulan"));
  const revM = monthlySeries(rs => rs.reduce((a, t) => a + t.r, 0));
  const ser = activeGames().map(g => ({ name: GN[g], color: GCOL[g], values: revM[g] }));
  root.append(chartCard({
    title: "Revenue bulanan per game", sub: "Area berwarna = periode terpilih. Jan 2026 hanya 1–9 Jan.",

      rows: MONTHS.map((ym, i) => { const r = { m: mLong(ym), _i: i, t: 0 }; ser.forEach((x, k) => { r["v" + k] = x.values[i]; r.t += x.values[i]; }); return r; }) })
  }));
}

/* ===================== 2. KESEHATAN BISNIS & REVENUE ===================== */
function pageRevenue(root) {
  const C = cur(), P = prev(), A = agg(C), B = agg(P);
  const [lo, hi] = rangeRev(202509, 202512);
  root.append(pageHead(2, "Kesehatan Bisnis & Revenue",
    `Revenue H2 2025 ${rpS(S.h2.rev)}, naik ${pct(chg(S.h2.rev, S.h1.rev), 0)} dari H1. Sejak September revenue bulanan bergerak di ${rpS(lo, 0)}–${rpS(hi, 0)} dan pertumbuhannya kini bertumpu pada harga, bukan volume.`,
    "Bisnis tumbuh, tetapi mesin pertumbuhannya berganti: dari menambah jumlah transaksi menjadi menaikkan nilai per transaksi."));

  root.append(story(
    { t: "Pertumbuhan 2025 terjadi dalam dua fase: ekspansi volume (Feb–Sep), lalu fase datar (Sep–Des).", c: "High",
      e: `Transaksi bulanan naik dari ${mtrx(202502)} (Feb) ke <b>${mtrx(202509)}</b> (Sep), lalu ${H2M.slice(1).join(" → ")} (Okt–Des). H2 vs H1: transaksi ${spct(chg(S.h2.trx, S.h1.trx), 0)}, AOV ${spct(chg(S.h2.aov, S.h1.aov), 0)}.`,
      i: "Pertumbuhan berikutnya butuh tambahan volume (pasokan dan kanal) atau harga yang lebih tinggi dan bertahan. Keduanya perlu dipantau bulanan." },
    { t: `Desember jadi bulan tertinggi (${rpS(S.dec.rev)}, ${spct(chg(S.dec.rev, S.nov.rev))} dari November), didorong nilai transaksi.`, c: "Medium",
      why: "Satu bulan; pola musiman belum bisa dibuktikan",
      e: `Transaksi hanya ${spct(chg(S.dec.trx, S.nov.trx))}. Median nilai transaksi ${rpS(S.nov.med)} → ${rpS(S.dec.med)}; porsi revenue kelas Premium ${pct(S.nov.share_premium)} → ${pct(S.dec.share_premium)}. Tanpa kelas Premium, AOV tetap naik ${pct(chg(S.dec.aov_ex_sp, S.nov.aov_ex_sp))}.`,
      i: "Kenaikan merata, bukan karena 1–2 transaksi besar. Apakah ini efek akhir tahun (libur sekolah) belum bisa dipastikan karena data baru punya satu Desember." },
    { t: `GPM naik dari ${pct(S.h1.gpm)} (H1) ke ${pct(S.h2.gpm)} (H2), lalu turun tipis di Q4.`, c: "High",
      e: `Bauran bergeser ke akun murah bermarkup tinggi, dan GPM ML membaik (${pct(S.ml.gpm_h1, 0)} → ${pct(S.ml.gpm_h2, 0)}). Q3 → Q4: ${pct(Q3.gpm)} → ${pct(Q4.gpm)}; GPM kanal langsung justru naik ${pct(K.q3.Langsung.gpm)} → ${pct(K.q4.Langsung.gpm)}.`,
      i: "Penurunan GPM Q4 berasal dari kanal mitra, bukan dari harga jual di kanal langsung (lihat halaman 4 dan 9)." }
  ));

  // A. revenue trend
  let mode = "m";
  const ctrl = h("div", { class: "seg", role: "group", "aria-label": "Granularitas" });
  const revM = monthlySeries(rs => rs.reduce((a, t) => a + t.r, 0));
  const ser = activeGames().map(g => ({ name: GN[g], color: GCOL[g], values: revM[g] }));
  const weeks = (() => {
    const map = new Map();
    TRX.filter(t => gOn(t.g) && t.d >= 20250301).forEach(t => {
      const d = new Date(Math.floor(t.d / 10000), Math.floor(t.d / 100) % 100 - 1, t.d % 100);
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const k = mon.getFullYear() * 10000 + (mon.getMonth() + 1) * 100 + mon.getDate();
      map.set(k, (map.get(k) || 0) + t.r);
    });
    const keys = [...map.keys()].sort();
    return { keys, vals: keys.map(k => map.get(k)) };
  })();
  let card;
  const drawA = el => {
    if (mode === "m") Charts.bar(el, { labels: MONTHS, xFmt: mLab, series: ser, stacked: true, yFmt: rpAx, tipFmt: v => rpS(v), band: bandIdx(), height: 270, tipHeader: l => mLong(l) });
    else {
      const ws = weeks.keys;
      const b0 = ws.findIndex(k => Math.floor(k / 100) >= ST.from), b1 = ws.length - 1 - [...ws].reverse().findIndex(k => Math.floor(k / 100) <= ST.to);
      Charts.line(el, { labels: ws, xFmt: k => dt(k).slice(0, 5), series: [{ name: "Revenue mingguan", color: "var(--s-ff)", values: weeks.vals }], yFmt: rpAx, tipFmt: v => rpS(v), band: b0 >= 0 && b1 >= b0 ? [b0, b1] : null, height: 270, area: true, tipHeader: k => "Minggu mulai " + dt(k) });
    }
  };
  [["m", "Bulanan"], ["w", "Mingguan"]].forEach(([k, l]) => {
    const b = h("button", { type: "button", "aria-pressed": String(k === mode) }, l);
    b.addEventListener("click", () => { mode = k; ctrl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); card._redraw(); });
    ctrl.appendChild(b);
  });
  card = chartCard({
    title: "Revenue per periode", sub: "Bulanan bertumpuk per game, atau total mingguan (Senin–Minggu). Area berwarna = periode terpilih.",
    legend: ser.map(x => ({ name: x.name, color: x.color })), controls: ctrl, draw: drawA,
    table: () => ({ cols: [{ k: "m", label: "Bulan" }, { k: "t", label: "Revenue", num: true, fmt: rp }, { k: "g", label: "MoM", num: true, fmt: v => spct(v) }, ...ser.map((x, i) => ({ k: "v" + i, label: x.name, num: true, fmt: rp }))],
      rows: MONTHS.map((ym, i) => { const r = { m: mLong(ym), t: 0 }; ser.forEach((x, k) => { r["v" + k] = x.values[i]; r.t += x.values[i]; }); return r; }).map((r, i, arr) => Object.assign(r, { g: i ? chg(r.t, arr[i - 1].t) : null })), sort: null })
  });
  root.append(sec("Tren revenue"), card);

  // B. GPM per game
  const gpmM = monthlySeries(rs => { const a = agg(rs); return a.trx >= 5 ? a.gpm : null; });
  const gser = activeGames().map(g => ({ name: GN[g], short: GC[g], color: GCOL[g], values: cut(gpmM[g]) }));
  root.append(grid("g2",
    chartCard({ title: "GPM bulanan per game", sub: "Bulan dengan < 5 transaksi tidak ditampilkan agar tidak menyesatkan. " + PARTIAL_NOTE,
      legend: gser.map(x => ({ name: x.name, color: x.color, kind: "ln" })), legendKind: "ln",
      draw: el => Charts.line(el, { labels: TM(), xFmt: mLab, series: gser, yFmt: v => pct(v, 0), tipFmt: v => pct(v), yMin: 0, yMax: 0.8, band: bandIdx(), height: 250, tipHeader: l => mLong(l) }),
      table: () => ({ cols: [{ k: "m", label: "Bulan" }, ...gser.map((x, i) => ({ k: "v" + i, label: x.name, num: true, fmt: v => pct(v) }))], rows: TM().map((ym, i) => { const r = { m: mLong(ym) }; gser.forEach((x, k) => r["v" + k] = x.values[i]); return r; }) }) }),
    (() => {
      // kontribusi per game
      const rows = activeGames().map(g => {
        const a = agg(C.filter(t => t.g === g)), b = P ? agg(P.filter(t => t.g === g)) : null;
        return { g: GN[g], rev: a.rev, sh: A.rev ? a.rev / A.rev : null, d: b ? chg(a.rev, b.rev) : null, gp: a.gp, gpm: a.gpm, trx: a.trx };
      });
      rows.push({ g: "Total", rev: A.rev, sh: 1, d: B ? chg(A.rev, B.rev) : null, gp: A.gp, gpm: A.gpm, trx: A.trx, _cls: "grp" });
      return h("div", { class: "card" }, h("h3", {}, "Kontribusi per game (periode terpilih)"), h("div", { class: "csub" }, "Δ = perubahan revenue vs periode pembanding."),
        table({ cols: [{ k: "g", label: "Game" }, { k: "rev", label: "Revenue", num: true, fmt: rpS }, { k: "sh", label: "Kontribusi", num: true, fmt: v => pct(v) },
          { k: "d", label: "Δ revenue", num: true, fmt: v => spct(v), cls: r => (r.d > 0 ? "up-t" : r.d < 0 ? "down-t" : "") }, { k: "gp", label: "Laba kotor", num: true, fmt: rpS }, { k: "gpm", label: "GPM", num: true, fmt: v => pct(v) }, { k: "trx", label: "Trx", num: true, fmt: num }], rows }));
    })()
  ));

  // C. multi-periode
  const cmp = (a, b, label) => {
    const fa = TRX.filter(t => inR(t.ym, a) && gOn(t.g)), fb = TRX.filter(t => inR(t.ym, b) && gOn(t.g));
    const A1 = agg(fa), B1 = agg(fb);
    return { p: label, a: rpS(B1.rev) + " → " + rpS(A1.rev), dr: chg(A1.rev, B1.rev), dt: chg(A1.trx, B1.trx), da: chg(A1.aov, B1.aov), g: pct(B1.gpm) + " → " + pct(A1.gpm), dg: A1.gpm - B1.gpm };
  };
  const rows = [];
  const pr = prevRange();
  if (pr) rows.push(cmp([ST.from, ST.to], pr, "Periode terpilih vs sebelumnya"));
  rows.push(cmp([202512, 202512], [202511, 202511], "Des vs Nov 2025"), cmp([202510, 202512], [202507, 202509], "Q4 vs Q3 2025"), cmp([202507, 202512], [202501, 202506], "H2 vs H1 2025"));
  const cl = k => r => (r[k] > 0.0005 ? "up-t" : r[k] < -0.0005 ? "down-t" : "");
  root.append(sec("Perbandingan multi-periode"), h("div", { class: "card" },
    h("div", { class: "csub" }, "Mengikuti filter game. YoY tidak ditampilkan karena belum ada 12 bulan data paralel."),
    table({ nosort: true, cols: [{ k: "p", label: "Perbandingan" }, { k: "a", label: "Revenue" }, { k: "dr", label: "Δ Revenue", num: true, fmt: v => spct(v), cls: cl("dr") }, { k: "dt", label: "Δ Transaksi", num: true, fmt: v => spct(v), cls: cl("dt") }, { k: "da", label: "Δ AOV", num: true, fmt: v => spct(v), cls: cl("da") }, { k: "g", label: "GPM" }, { k: "dg", label: "Δ GPM", num: true, fmt: v => spp(v), cls: cl("dg") }], rows })));
}

/* ===================== 3. TRANSAKSI & AOV ===================== */
function pageTransaksi(root) {
  const C = cur(), P = prev();
  const dq = S.dec_q4q3.ALL;
  root.append(pageHead(3, "Transaksi & AOV",
    `Kenaikan revenue Q4 sebesar ${srp(Q4.rev - Q3.rev)} berasal dari AOV (${srp(dq.aov)}); efek volume hanya ${srp(dq.vol)}.`,
    "Pertanyaan halaman ini: pertumbuhan berasal dari jumlah transaksi atau dari nilai per transaksi?"));
  const B = S.bands;
  root.append(story(
    { t: "Volume mendatar sejak September; nilai per transaksi yang naik.", c: "High",
      e: `Transaksi Sep–Des: ${H2M.join(" → ")}. Q4 vs Q3 transaksi ${spct(chg(Q4.trx, Q3.trx))}, AOV ${spct(chg(Q4.aov, Q3.aov))} (${rpS(Q3.aov)} → ${rpS(Q4.aov)}).`,
      i: "Menaikkan harga punya batas. Tanpa tambahan volume, pertumbuhan akan melambat begitu AOV berhenti naik." },
    { t: "Dekomposisi per game berbeda arah: ML tumbuh lewat volume, FF lewat AOV, Roblox kehilangan volume.", c: "High",
      e: `Q4 vs Q3. FF: volume ${srp(S.dec_q4q3.FF.vol)}, AOV ${srp(S.dec_q4q3.FF.aov)}. ML: volume ${srp(S.dec_q4q3.ML.vol)}, AOV ${srp(S.dec_q4q3.ML.aov)}. Roblox: volume ${srp(S.dec_q4q3.RB.vol)}, AOV ${srp(S.dec_q4q3.RB.aov)}.`,
      i: "Tiap game butuh tuas yang berbeda: pasokan untuk FF, menjaga momentum volume ML, dan memperbaiki pola stok Roblox." },
    { t: `Kelas Premium menaikkan AOV tetapi marginnya paling tipis (${pct(B[4].gpm)}) dan paling lambat laku.`, c: "High",
      e: `GPM per kelas: Murah ${pct(B[0].gpm)}, Menengah bawah ${pct(B[1].gpm)}, Menengah ${pct(B[2].gpm)}, Menengah atas ${pct(B[3].gpm)}, Premium ${pct(B[4].gpm)}. Median hari laku Premium ${B[4].dts} hari vs ${B[1].dts} hari untuk Menengah bawah.`,
      i: "Mengejar AOV lewat akun Premium menurunkan GPM dan mengikat modal lebih lama. Kelas Menengah bawah–Menengah memberi kombinasi margin dan kecepatan yang paling seimbang." },
    { t: "Satu transaksi selalu berisi satu akun, jadi 'unit per transaksi' selalu 1.", c: "High",
      e: "Setiap baris data adalah satu akun dengan satu harga jual.", i: "Analisis basket diganti dengan bauran kelas harga." }
  ));

  const trxM = monthlySeries(rs => rs.length);
  const aovM = monthlySeries(rs => (rs.length >= 5 ? rs.reduce((a, t) => a + t.r, 0) / rs.length : null));
  const ts = activeGames().map(g => ({ name: GN[g], short: GC[g], color: GCOL[g], values: cut(trxM[g]) }));
  const as = activeGames().map(g => ({ name: GN[g], short: GC[g], color: GCOL[g], values: cut(aovM[g]) }));
  const lg = ts.map(x => ({ name: x.name, color: x.color, kind: "ln" }));
  root.append(sec("Volume dan nilai transaksi"), grid("g2",
    chartCard({ title: "Transaksi per bulan", sub: "Jumlah akun terjual. " + PARTIAL_NOTE, legend: lg, legendKind: "ln",
      draw: el => Charts.line(el, { labels: TM(), xFmt: mLab, series: ts, yFmt: num, band: bandIdx(), height: 240, tipHeader: l => mLong(l) }),
      table: () => ({ cols: [{ k: "m", label: "Bulan" }, ...ts.map((x, i) => ({ k: "v" + i, label: x.name, num: true, fmt: num }))], rows: TM().map((ym, i) => { const r = { m: mLong(ym) }; ts.forEach((x, k) => r["v" + k] = x.values[i]); return r; }) }) }),
    chartCard({ title: "AOV per bulan", sub: "Nilai rata-rata per transaksi; bulan dengan < 5 transaksi disembunyikan.", legend: lg, legendKind: "ln",
      draw: el => Charts.line(el, { labels: TM(), xFmt: mLab, series: as, yFmt: rpAx, tipFmt: v => rpS(v), yMin: 0, band: bandIdx(), height: 240, tipHeader: l => mLong(l) }),
      table: () => ({ cols: [{ k: "m", label: "Bulan" }, ...as.map((x, i) => ({ k: "v" + i, label: x.name, num: true, fmt: v => (v === null ? "—" : rp(v)) }))], rows: TM().map((ym, i) => { const r = { m: mLong(ym) }; as.forEach((x, k) => r["v" + k] = x.values[i]); return r; }) }) })
  ));

  // dekomposisi dinamis
  const labels = [], vol = [], aovE = [];
  if (P) {
    activeGames().forEach(g => { const d = decompose(P.filter(t => t.g === g), C.filter(t => t.g === g)); if (d) { labels.push(GN[g]); vol.push(d.vol); aovE.push(d.aov); } });
    const d = decompose(P, C); if (d) { labels.push("Total"); vol.push(d.vol); aovE.push(d.aov); }
  }
  const dTot = P ? decompose(P, C) : null;
  root.append(sec("Dekomposisi perubahan revenue"), grid("g2",
    P && labels.length ? chartCard({

function pageWaktu(root) {
  const C = cur();

    "Tidak ada pola hari tertentu. Perubahan besar terjadi pada beberapa titik struktural, dan sebagian besar lonjakan harian dijelaskan oleh satu transaksi bernilai besar atau input penjualan yang dikumpulkan di satu tanggal.",
    "Halaman ini memisahkan signal (pola konsisten dan material) dari noise (fluktuasi kecil tanpa implikasi)."));
  root.append(story(
    { t: "Weekday vs weekend: noise, bukan signal.", c: "High", e: `Mar–Des 2025 rata-rata ${NF1.format(S.weekend.we)} transaksi per hari di akhir pekan vs ${NF1.format(S.weekend.wd)} di hari kerja.`, i: "Jadwal admin dan promosi tidak perlu dibedakan menurut hari. Jam transaksi tidak tercatat, jadi peak hour tidak bisa dianalisis." },
    { t: "Revenue mingguan makin stabil.", c: "High", e: `Koefisien variasi revenue mingguan ${NF1.format(S.weekly_cv.all * 100)}% (Mar–Des 2025) turun ke ${NF1.format(S.weekly_cv.last13 * 100)}% pada 13 minggu terakhir.`, i: "Bisnis sudah keluar dari fase awal yang fluktuatif, sehingga penyimpangan mingguan > 20% layak diperiksa." },
    { t: "Lonjakan Desember: signal sedang; perlambatan awal Januari: belum bisa disimpulkan.", c: "Low", kind: "hyp",
      e: `Desember naik ${pct(chg(S.dec.rev, S.nov.rev))} dari November dengan kenaikan merata pada nilai transaksi. 1–9 Jan 2026: ${NF1.format(S.jan_pace.jan)} transaksi/hari vs ${NF1.format(S.jan_pace.dec)} di Desember.`,
      i: "Januari baru 9 hari dan mencakup libur tahun baru; bisa juga ada penjualan yang belum diinput. Pantau sampai akhir Januari sebelum mengambil keputusan." }
  ));

  // harian + median 28 hari
  const days = [];
  for (let d = new Date(2025, 2, 1); d <= new Date(2026, 0, 9); d.setDate(d.getDate() + 1)) days.push(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
  const map = new Map();
  TRX.forEach(t => { if (gOn(t.g)) map.set(t.d, (map.get(t.d) || 0) + t.r); });
  const dv = days.map(d => map.get(d) || 0);
  const med = dv.map((_, i) => { const w = dv.slice(Math.max(0, i - 14), Math.min(dv.length, i + 14)); return w.length >= 14 ? median(w) : null; });
  const b0 = days.findIndex(d => Math.floor(d / 100) >= ST.from), b1 = days.length - 1 - [...days].reverse().findIndex(d => Math.floor(d / 100) <= ST.to);
  const allG = ST.games.every(Boolean);
  const markers = allG ? D.anomalies.map(a => ({ i: days.indexOf(a.tgl), v: a.actual })).filter(m => m.i >= 0) : [];
  root.append(sec("Pola harian"), chartCard({
    title: "Revenue harian dan median bergerak 28 hari", sub: "Lingkaran merah = anomali (|z robust| > 3,5 terhadap median 28 hari), hanya tampil saat semua game dipilih.",
    legend: [{ name: "Revenue harian", color: "var(--s-ff)", kind: "ln" }, { name: "Median 28 hari", color: "var(--s-line2)", kind: "ln" }, { name: "Anomali", color: "var(--down)", kind: "ln" }],
    draw: el => Charts.line(el, { labels: days, xFmt: d => dt(d).slice(0, 5), series: [{ name: "Revenue harian", color: "var(--s-ff)", values: dv, width: 1.2 }, { name: "Median 28 hari", color: "var(--s-line2)", values: med }], yFmt: rpAx, tipFmt: v => rpS(v), dots: false, band: b0 >= 0 && b1 >= b0 ? [b0, b1] : null, markers, height: 270, tipHeader: d => dt(d) }),
    table: () => ({ cols: [{ k: "d", label: "Tanggal", fmt: dt }, { k: "v", label: "Revenue", num: true, fmt: rp }, { k: "m", label: "Median 28 hari", num: true, fmt: v => (v === null ? "—" : rp(v)) }], rows: days.map((d, i) => ({ d, v: dv[i], m: med[i] })), sort: { k: "d", desc: true } })
  }));

  // hari dalam seminggu (dinamis)
  const nd = Array(7).fill(0), nt = Array(7).fill(0), nr = Array(7).fill(0);
  const startD = new Date(Math.floor(ST.from / 100), ST.from % 100 - 1, 1);

  C.forEach(t => { const d = new Date(Math.floor(t.d / 10000), Math.floor(t.d / 100) % 100 - 1, t.d % 100); const w = (d.getDay() + 6) % 7; nt[w]++; nr[w] += t.r; });
  const DOW = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"];
  const tpd = nt.map((n, i) => (nd[i] ? n / nd[i] : 0));
  // rentang noise: 2 x standar error rata-rata per hari-minggu
  const dayCnt = new Map();
  C.forEach(t => dayCnt.set(t.d, (dayCnt.get(t.d) || 0) + 1));
  const daily = [];
  for (let d = new Date(startD); d <= endD && d <= snap; d.setDate(d.getDate() + 1)) daily.push(dayCnt.get(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) || 0);
  const mean = daily.reduce((a, b) => a + b, 0) / (daily.length || 1);
  const sdv = Math.sqrt(daily.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, daily.length - 1));
  const se2 = (2 * sdv) / Math.sqrt(Math.max(1, daily.length / 7));

    chartCard({ title: "Rata-rata transaksi per hari", sub: "Periode terpilih, dinormalisasi dengan jumlah hari kalender.", foot: `Rata-rata semua hari ${NF1.format(mean)} transaksi. Selisih antar-hari di bawah ±${NF1.format(se2)} (2 × standar error per hari-minggu) masih dalam rentang noise.`,

    h("div", { class: "card" }, h("h3", {}, "Titik perubahan struktural"), h("div", { class: "csub" }, "Peristiwa yang mengubah pola data, bukan fluktuasi biasa."),
      table({ nosort: true, cols: [{ k: "w", label: "Waktu" }, { k: "e", label: "Peristiwa" }, { k: "x", label: "Dampak pada analisis", wrap: true }], rows: [
        { w: "Feb 2025", e: "FF mulai dicatat", x: "Volume melonjak; FF jadi lini terbesar sejak Mar 2025." },
        { w: "Apr 2025", e: "Roblox mulai dijual", x: "Lini baru dengan margin tertinggi." },
        { w: "Jul 2025", e: "Nama admin mulai dicatat", x: "Analisis admin hanya valid Jul 2025 ke atas." },
        { w: "Jul 2025", e: `Pembelian borongan Roblox (${S.rb.batch_n} akun)`, x: `Puncak Roblox Agustus: ${S.rb.batch_aug} dari ${S.rb.aug_trx} transaksi berasal dari batch ini.` },
        { w: "Sep 2025", e: "Kanal " + MJ + " mulai", x: `Porsi revenue mitra naik ke ${pct(K.q4.mitra_share)} di Q4.` },

  const R = [

    { r: "Ketergantungan pada Free Fire", e: `${pct(S.conc.rev_share.FF, 0)} revenue dan ${pct(S.conc.gp_share.FF, 0)} laba kotor.`, s: "Sedang", c: "High", m: "Kontribusi revenue per game" },

    { r: "Pencatatan spreadsheet rawan salah baca", e: "1.331 tanggal tertukar format, satuan rupiah campur ribuan/penuh, 12 profit ditimpa manual.", s: "Sedang", c: "High", m: "Baris ber-flag per minggu" },
    { r: "Kebocoran operasional", e: `${S.loss.n} akun, modal ${rpS(S.loss.modal)} (${pct(S.loss.share_gp)} laba kotor).`, s: "Rendah", c: "High", m: "Modal tanpa pendapatan per bulan" },

/* ===================== 8. PELUANG & SKENARIO ===================== */
function pagePeluang(root) {
  root.append(pageHead(8, "Peluang & Skenario",
    "Peluang yang didukung data: menambah pasokan akun yang cepat laku, mengikuti tren Roblox dengan batch kecil, dan menutup sebagian selisih margin kanal mitra.",
    "Potensi dihitung dengan aritmetika sederhana dari data Q4 2025, bukan prediksi."));
  const ff = Q4.FF, fi = S.rb.seg["Fish It"];
  root.append(grid("g2",
    story({ t: "1. Tambah pasokan FF/ML", hyp: true, c: "Medium", kind: "opp", why: "Bergantung pada asumsi permintaan belum terlayani",
      e: `Sell-through FF ${pct(S.sellthrough.FF.min, 0)}–100%, median laku ${S.dts.FF.med} hari; ${pct(S.dts.FF.le7, 0)} akun FF laku ≤ 7 hari. Stok Ready FF hanya ${S.ready.FF.n} akun.`,
      i: `Setiap +10 akun FF terjual per bulan ≈ <b>+${rpS(10 * ff.aov)}</b> revenue dan <b>+${rpS(10 * ff.aov * ff.gpm)}</b> laba kotor per bulan (AOV & GPM FF Q4). Validasi: catat permintaan yang tidak terlayani.` }),
    story({ t: "2. Perbaiki margin kanal mitra", hyp: true, c: "Medium", kind: "opp", why: "Respons mitra terhadap harga belum diketahui",
      e: `Q4: revenue mitra ${rpS(K.q4["Mitra - dijualkan"].rev + K.q4["Mitra - dibeli mitra"].rev)}, GPM ${pct(K.q4.mitra_gpm)} vs ${pct(K.q4.Langsung.gpm)} di kanal langsung.`,
      i: `Menutup separuh selisih margin ≈ <b>+${rpS(K.gap_q4 / 2)}</b> laba kotor per kuartal, dengan asumsi volume mitra tidak berubah.` }),
    story({ t: "3. Ikuti tren Roblox dengan batch kecil", c: "Medium", kind: "opp",
      e: `Fish It: median laku ${fi.dts} hari, AOV ${rpS(fi.aov)}, GPM ${pct(fi.gpm)}; ${S.rb.fishit_dec} transaksi di Desember. Batch besar Juli butuh median ${S.rb.batch_dts} hari untuk laku dan ${S.rb.batch_ready} akun masih tersisa.`,
      i: "Beli dalam jumlah kecil tetapi sering, sesuai subkategori yang sedang naik, dan hentikan pembelian segmen yang mulai melambat." }),
    story({ t: "4. Cairkan stok Ready", c: "High", kind: "opp",
      e: `${num(S.ready.n)} akun Ready bernilai daftar ${rpS(S.ready.list)} (modal ${rpS(S.ready.modal)}). Roblox: ${S.ready.RB.gt90} akun > 90 hari dan ${S.ready.RB.no_date} tanpa tanggal masuk.`,
      i: "Diskon terarah untuk stok > 90 hari atau penyaluran lewat mitra mengembalikan modal kerja untuk membeli akun yang lebih cepat laku." }),
    story({ t: "5. Pertahankan momentum ML massal", c: "High", kind: "opp",
      e: `ML Q4 ${num(Q4.ML.trx)} transaksi (${spct(chg(Q4.ML.trx, Q3.ML.trx), 0)} vs Q3), GPM ${pct(Q4.ML.gpm)}, median laku ${S.dts.ML.med} hari.`,
      i: "ML kini punya profil yang mirip FF: cepat laku dan marginnya sehat. Pasokan ML layak ditambah bertahap." })
  ));

  // simulator
  const base = { trx: Q4.trx / 3, aov: Q4.aov, ms: K.q4.mitra_share, gd: K.q4.Langsung.gpm, gm: K.q4.mitra_gpm };
  const h2max = Math.max(...[202507, 202508, 202509, 202510, 202511, 202512].map(mtrx));
  const SC = {
    Base: { dv: 0, da: 0, ms: base.ms, gm: base.gm, note: `Rata-rata bulanan Q4 2025 bertahan: ${num(base.trx)} transaksi, AOV ${rpS(base.aov)}, porsi mitra ${pct(base.ms)}, GPM mitra ${pct(base.gm)}, GPM langsung ${pct(base.gd)}.` },
    Upside: { dv: h2max / base.trx - 1, da: S.dec.aov / base.aov - 1, ms: base.ms, gm: 0.5, note: `Volume kembali ke bulan terbaik H2 (${h2max} transaksi), AOV bertahan di level Desember (${rpS(S.dec.aov)}), GPM mitra naik ke 50%.` },
    Downside: { dv: (S.jan_pace.jan * 30.4) / base.trx - 1, da: 0, ms: base.ms, gm: base.gm, note: `Laju 1–9 Januari 2026 berlanjut (${NF1.format(S.jan_pace.jan)} transaksi/hari ≈ ${num(S.jan_pace.jan * 30.4)}/bulan), AOV rata-rata Q4.` } };
  const calc = p => { const trx = base.trx * (1 + p.dv), rev = trx * base.aov * (1 + p.da), gp = rev * ((1 - p.ms) * base.gd + p.ms * p.gm); return { trx, rev, gp, gpm: gp / rev }; };
  const B0 = calc(SC.Base);
  const st = Object.assign({}, SC.Base);
  const out = h("div", { class: "grid g-kpi" });
  const mkS = (lab, key, min, max, stp, fmt) => {
    const lv = h("b", {}, fmt(st[key]));
    const inp = h("input", { type: "range", min, max, step: stp, value: st[key], "aria-label": lab });
    inp.addEventListener("input", () => { st[key] = +inp.value; lv.textContent = fmt(st[key]); render(); });
    return { el: h("div", {}, h("label", {}, lab, lv), inp), inp, lv, key, fmt };
  };
  const sliders = [mkS("Perubahan volume", "dv", -0.6, 0.4, 0.01, v => spct(v, 0)), mkS("Perubahan AOV", "da", -0.3, 0.3, 0.01, v => spct(v, 0)), mkS("Porsi revenue kanal mitra", "ms", 0, 0.6, 0.01, v => pct(v, 0)), mkS("GPM kanal mitra", "gm", 0.2, 0.65, 0.005, v => pct(v, 1))];
  const render = () => {
    const r = calc(st);
    out.replaceChildren(
      kpi("Transaksi / bulan", num(r.trx), deltaEl(r.trx, B0.trx)), kpi("Revenue / bulan", rpS(r.rev), deltaEl(r.rev, B0.rev)),
      kpi("Laba kotor / bulan", rpS(r.gp), deltaEl(r.gp, B0.gp)), kpi("GPM", pct(r.gpm), deltaEl(r.gpm, B0.gpm, "pp")));
  };
  const presetBtns = h("div", { class: "seg" });
  Object.keys(SC).forEach(k => {
    const b = h("button", { type: "button", "aria-pressed": String(k === "Base") }, k);
    b.addEventListener("click", () => { Object.assign(st, SC[k]); sliders.forEach(s => { s.inp.value = st[s.key]; s.lv.textContent = s.fmt(st[s.key]); }); presetBtns.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
    presetBtns.appendChild(b);
  });
  render();
  const scRows = Object.entries(SC).map(([k, p]) => { const r = calc(p); return { k, a: p.note, trx: r.trx, rev: r.rev, gp: r.gp, gpm: r.gpm, d: r.gp - B0.gp }; });
  root.append(sec("Skenario Base / Upside / Downside"),
    h("div", { class: "card" }, h("div", { class: "card-head" }, h("div", {}, h("h3", {}, "Simulator skenario bulanan"), h("div", { class: "csub" }, "Revenue = transaksi × AOV. Laba kotor = revenue × [(1 − porsi mitra) × GPM langsung + porsi mitra × GPM mitra]. GPM langsung dikunci di level Q4.")), presetBtns),
      h("div", { class: "sim" }, h("div", { class: "ctrl" }, ...sliders.map(s => s.el)), out),
      h("div", { class: "note" }, "Laba kotor Base sedikit di atas aktual Q4 karena GPM diterapkan ke seluruh revenue, termasuk 1,6% transaksi yang modalnya tidak tercatat.")),
    h("div", { class: "card", style: "margin-top:16px" }, h("h3", {}, "Asumsi eksplisit tiap skenario"), h("div", { class: "csub" }, "Ilustrasi, bukan prediksi. Data belum cukup untuk memodelkan musiman atau elastisitas harga."),
      table({ nosort: true, cols: [{ k: "k", label: "Skenario" }, { k: "a", label: "Asumsi", wrap: true }, { k: "trx", label: "Trx/bln", num: true, fmt: num }, { k: "rev", label: "Revenue/bln", num: true, fmt: rpS }, { k: "gp", label: "Laba kotor/bln", num: true, fmt: rpS }, { k: "gpm", label: "GPM", num: true, fmt: v => pct(v) }, { k: "d", label: "Δ laba vs Base", num: true, fmt: srp }], rows: scRows })));
}

      { k: "Revenue", f: "Σ Jual pada transaksi bertanggal" }, { k: "Laba kotor", f: "Σ (Jual − Modal) pada basis margin" },
      { k: "GPM", f: "Laba kotor ÷ Revenue (basis margin yang sama)" }, { k: "AOV", f: "Revenue ÷ jumlah transaksi" },
      { k: "Efek volume / AOV", f: "ΔTrx × AOV lama / ΔAOV × Trx baru" }, { k: "Sell-through kohort", f: "Akun terjual ÷ akun masuk pada bulan masuk yang sama" },
      { k: "Hari laku", f: "Tanggal jual − tanggal masuk (≥ 0)" }, { k: "Modal tertahan", f: "Σ Modal akun Ready per snapshot" },
      { k: "Konsentrasi", f: "Revenue top-N transaksi ÷ revenue total" }, { k: "Anomali harian", f: "|revenue − median 28 hari| ÷ (1,4826 × MAD) > 3,5" }] }))
  ));

  root.append(sec("Aturan cleaning, pengecualian, dan asumsi"), grid("g2",
    h("div", { class: "card", html: `<h3>Aturan cleaning</h3><ol style="margin:8px 0 0;padding-left:20px;display:grid;gap:5px;color:var(--ink-2)">
      <li>Sel datetime: hari dan bulan ditukar (salah baca D/M sebagai M/D).</li>
      <li>Teks D/M[/Y]; tahun dua digit → 20YY.</li>
      <li>Tahun hilang/invalid → tahun terbaru ≤ snapshot, atau yang konsisten dengan tanggal masuk.</li>
      <li>Tanggal setelah snapshot 09/01/2026 → tahun dikurangi satu.</li>
      <li>Tanggal masuk yang menyimpang > 60 hari dari median 14 baris tetangga → koreksi tahun ±1.</li>
      <li>Tanggal jual sebelum tanggal masuk dan wajar bila +1 tahun → dikoreksi.</li>
      <li>Nominal < 1.000 dikali 1.000; ≥ 1.000 apa adanya.</li>
      <li>Profit = Jual − Modal.</li>
      <li>Normalisasi status, nama game, kode akun, nama admin.</li>
      <li>Tidak ada baris yang dihapus; pengecualian memakai kolom flag.</li></ol>` }),
    h("div", { class: "card", html: `<h3>Pengecualian dan asumsi</h3><ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--ink-2)">
      <li>Akun Sold tanpa harga jual tidak dihitung sebagai transaksi. Yang bukan transaksi mitra dicatat sebagai kebocoran.</li>
      <li>Transaksi tanpa modal tetap masuk revenue, tetapi tidak masuk perhitungan margin.</li>
      <li>${D.mitra_code ? `"${D.mitra_code}" = mitra re-seller. "(nnn ${D.mitra_code})" = akun dijual lewat mitra; "Dibeli ${D.mitra_code}" = akun dibeli mitra.` : "Kode mitra di kolom Kode Akun menandai kanal mitra re-seller: akun dijual lewat mitra, atau akun dibeli mitra."}</li>
      <li>Kontak WhatsApp = penjual akun ke perusahaan, bukan pembeli; karena itu halaman Customer Analytics dihilangkan.</li>
      <li>Kolom Notes berisi nama admin (interpretasi; confidence Medium).</li>
      <li>Arti label FS belum dikonfirmasi; dianalisis tanpa ditafsirkan.</li>
      <li>Januari 2026 hanya 1–9 Januari dan tidak dibandingkan langsung dengan bulan penuh.</li></ul>` })
  ));

  root.append(grid("g2",
    h("div", { class: "card", html: `<h3>What the data can tell us</h3><ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--ink-2)">
      <li>Revenue, laba kotor, GPM, dan AOV per game, kanal, kelas harga, dan bulan.</li>
      <li>Kecepatan jual, sell-through, dan umur stok.</li>
      <li>Kebocoran akun tanpa pendapatan dan kualitas pencatatan.</li>
      <li>Ketergantungan pada game, admin, kanal, dan penjual akun.</li>
      <li>Perubahan struktural dan anomali harian.</li></ul>` }),
    h("div", { class: "card", html: `<h3>What the data cannot tell us</h3><ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--ink-2)">
      <li>Laba bersih dan efisiensi biaya: biaya operasional tidak tercatat.</li>
      <li>Perilaku pelanggan (repeat, retensi, CLV): tidak ada ID pembeli.</li>
      <li>Apakah kanal mitra menambah atau menggantikan penjualan langsung.</li>
      <li>Permintaan yang tidak terlayani karena stok kosong.</li>
      <li>Musiman tahunan, YoY, dan pola jam transaksi.</li>
      <li>Kondisi setelah 09/01/2026.</li></ul>` })
  ));
  root.append(h("div", { class: "card", style: "margin-top:16px", html: `<h3>Data tambahan yang dibutuhkan</h3><ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--ink-2)">
    <li>Biaya operasional bulanan (iklan, fee pembayaran, gaji/komisi admin).</li>
    <li>Kanal dan identitas pembeli (minimal pseudonim) untuk analisis pelanggan dan kanibalisasi mitra.</li>
    <li>Log permintaan yang tidak terlayani (akun dicari tapi tidak ada stok).</li>
    <li>Alasan setiap akun yang keluar tanpa penjualan, garansi, dan refund.</li>
    <li>Target bulanan per game agar aktual vs target bisa dibandingkan.</li></ul>` }));

  const dq = D.dq.map(x => ({ ...x, det: x.jenis.startsWith("Tanggal") ? `masuk ${dt(x.a)}, jual ${dt(x.b)}` : x.jenis.startsWith("Profit") ? `tercatat ${rp(x.a)} vs hitung ${rp(x.b)}` : `modal ${rp(x.a)}, jual ${rp(x.b)}` }));
  root.append(sec("Daftar anomali pencatatan"), h("div", { class: "card" }, table({ cols: [{ k: "jenis", label: "Jenis" }, { k: "kode", label: "Kode" }, { k: "game", label: "Game" }, { k: "det", label: "Detail" }, { k: "nilai", label: "Selisih / profit", num: true, fmt: v => (v === null || v === undefined ? "—" : rp(v)) }], rows: dq, sort: { k: "jenis", desc: false } })));
  root.append(h("div", { class: "card", style: "margin-top:16px", html: PUB
    ? `<h3>Catatan versi publik</h3><p class="csub" style="margin:6px 0 0">Nama perusahaan disamarkan menjadi PT XYZ dan nama admin menjadi Admin A, B, dan seterusnya. Nilai rupiah setiap transaksi dikalikan faktor rahasia dengan variasi kecil per baris (±4%), sehingga harga asli tidak bisa ditebak. Tanggal, jumlah transaksi, dan kelas harga sesuai data asli; persentase dan rasio hanya bergeser sangat kecil (umumnya di bawah 0,2 poin). Data mentah, nomor kontak, ID akun game, dan tautan tidak disertakan.</p>`
    : `<h3>Catatan versi internal</h3><p class="csub" style="margin:6px 0 0">Versi ini memakai angka dan nama asli. Jangan dibagikan di luar perusahaan; gunakan versi publik untuk portofolio.</p>` }));
}

/* ===================== NAVIGASI & INIT ===================== */
const PAGES = [
  ["ringkasan", "Ringkasan Eksekutif", pageRingkasan], ["revenue", "Kesehatan Bisnis & Revenue", pageRevenue],
  ["transaksi", "Transaksi & AOV", pageTransaksi], ["produk", "Performa Produk", pageProduk],
  ["waktu", "Waktu, Tren & Anomali", pageWaktu], ["operasional", "Operasional & Stok", pageOperasional],
  ["risiko", "Konsentrasi & Risiko", pageRisiko], ["peluang", "Peluang & Skenario", pagePeluang],
  ["keputusan", "Perbandingan & Keputusan", pageKeputusan], ["register", "Insight Register & Monitoring", pageRegister],
  ["qa", "Executive Q&A", pageQA], ["metodologi", "Data Quality & Methodology", pageMetodologi]];

function render(keepScroll) {
  const y = window.scrollY;
  DRAWERS.length = 0;
  Charts.hideTip();
  const root = document.getElementById("page");
  root.replaceChildren();
  const p = PAGES.find(x => x[0] === ST.page) || PAGES[0];
  p[2](root);
  root.append(h("div", { class: "foot", html: `${esc(D.company)} · Data ${dt(D.first)} – ${dt(D.snapshot)} · Format angka Indonesia · ${PUB ? "Versi publik (nilai rupiah disamarkan)" : "Versi internal"}` }));
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.id === ST.page ? "page" : "false"));
  document.title = `${p[1]} · Dashboard Jual Beli Akun · ${D.company_short}`;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

function initUI() {
  document.getElementById("brand-co").textContent = D.company_short;
  const nav = document.getElementById("nav");
  PAGES.forEach(([id, title], i) => {
    const b = h("button", { type: "button", "data-id": id }, h("span", { class: "no" }, String(i + 1)), title);
    b.addEventListener("click", () => { ST.page = id; history.replaceState(null, "", "#" + id); document.querySelector(".sidebar").classList.remove("open"); render(false); });
    nav.appendChild(b);
  });
  // filter periode
  const ps = document.getElementById("f-preset"), fr = document.getElementById("f-from"), to = document.getElementById("f-to"), cust = document.getElementById("f-custom");
  PRESETS.forEach(p => ps.appendChild(h("option", { value: p.id }, p.label)));
  MONTHS.forEach(m => { fr.appendChild(h("option", { value: m }, mLong(m))); to.appendChild(h("option", { value: m }, mLong(m))); });
  const sync = () => { ps.value = ST.preset; fr.value = ST.from; to.value = ST.to; cust.hidden = ST.preset !== "custom"; };
  ps.addEventListener("change", () => { const p = PRESETS.find(x => x.id === ps.value); ST.preset = p.id; if (p.r) { ST.from = p.r[0]; ST.to = p.r[1]; } sync(); render(true); });
  const onRange = () => { let a = +fr.value, b = +to.value; if (a > b) [a, b] = [b, a]; ST.from = a; ST.to = b; ST.preset = "custom"; sync(); render(true); };
  fr.addEventListener("change", onRange); to.addEventListener("change", onRange);
  sync();
  // filter game
  const chips = document.getElementById("f-games");
  GN.forEach((g, i) => {
    const b = h("button", { type: "button", class: "chip", "aria-pressed": "true" }, h("span", { class: "dot", style: `background:${GCOL[i]}` }), g);
    b.addEventListener("click", () => {
      if (ST.games[i] && ST.games.filter(Boolean).length === 1) return;
      ST.games[i] = !ST.games[i]; b.setAttribute("aria-pressed", String(ST.games[i])); render(true);
    });
    chips.appendChild(b);
  });
  document.getElementById("f-note").textContent = `Data s.d. ${dt(D.snapshot)}`;
  // tema
  const tb = document.getElementById("theme-btn");
  const setTheme = t => { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); try { t ? localStorage.setItem("dash-theme", t) : localStorage.removeItem("dash-theme"); } catch (e) {} };
  try { const t = localStorage.getItem("dash-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  tb.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    setTheme(dark ? "light" : "dark"); render(true);
  });
  document.getElementById("menu-btn").addEventListener("click", () => document.querySelector(".sidebar").classList.toggle("open"));
  const hsh = location.hash.slice(1);
  if (PAGES.some(p => p[0] === hsh)) ST.page = hsh;
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DRAWERS.forEach(f => f()), 150); });
  render(false);
}
initUI();

</script>
</body>
</html>
